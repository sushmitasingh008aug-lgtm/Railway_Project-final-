version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: block_planning_db
    environment:
      POSTGRES_DB: block_planning
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: block_planning_app
    ports:
      - "3000:3000"
    environment:
      POSTGRES_URI: postgresql://postgres:postgrespassword@postgres:5432/block_planning
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
